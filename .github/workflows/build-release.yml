name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag'
        required: false
        default: 'v1.1.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LocationSpoofer.dylib
        run: |
          xcrun --sdk iphoneos clang -target arm64-apple-ios14.0 \
            -dynamiclib \
            -fobjc-arc \
            -Wall -Wextra \
            -Wl,-segalign,0x4000 \
            -ISource \
            Source/dylib_init.m \
            Source/LSHooking.m \
            Source/LocationSpoofer.m \
            Source/RouteSimulator.m \
            Source/BookmarksManager.m \
            Source/OverlayWindow.m \
            Source/MapPickerViewController.m \
            Source/MapPickerViewController+Route.m \
            Source/MapPickerViewController+Bookmarks.m \
            Source/PersistenceManager.m \
            Source/LSUpdateChecker.m \
            -framework Foundation \
            -framework UIKit \
            -framework CoreLocation \
            -framework MapKit \
            -framework CoreGraphics \
            -framework QuartzCore \
            -install_name @rpath/LocationSpoofer.dylib \
            -o LocationSpoofer.dylib
          codesign -s - -f LocationSpoofer.dylib
          codesign -dvv LocationSpoofer.dylib
          ls -lh LocationSpoofer.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationSpoofer.dylib
          path: LocationSpoofer.dylib

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              TAG="${GITHUB_REF#refs/tags/}"
            else
              TAG="v1.2.6"
            fi
          fi
          echo "Using tag: $TAG"
          cat << 'EOF' > notes.md
          ## LSpoof+ v1.2.6 - Neumorphic Soft UI & Harmonized Animations

          ### What's New
          - **Neumorphic Soft UI (Zero Lag)**: Dual-tone elevation highlights and diffuse soft drop shadows with hardware-accelerated `CALayer shadowPath` caching and layer rasterization (`shouldRasterize = YES`). Delivers locked 60/120 ProMotion FPS table scrolling with zero off-screen rendering lag.
          - **Debossed Wells & Raised Embossed Surfaces**: Tactile recessed wells for coordinate inputs (`latitude`, `longitude`, `altitude`, `customSpeedField`, and `searchTextField`), paired with raised soft cards for all tweak controls.
          - **Tactile Micro-Spring Buttons**: Interactive action buttons (`Apply`, `Stop`, `Start Simulation`, `Select`) depress (`0.96` scale) on touch-down and spring return (`0.62` damping) on touch-up.
          - **Harmonized Apple-Grade Transitions**: Cohesive spring physics across sheet presentation, tab switching (0.35s damping 0.82 with cross-dissolve table updates), waypoint search unfolding/folding, and realistic Apple Maps pin-drop physics.
          - **Ad-Hoc Code Signed**: Pre-signed arm64 Mach-O dylib with 16KB segment alignment for LiveContainer, TrollStore, and Sideloadly compatibility.
          - **3-Finger Gesture**: Hold three fingers anywhere on screen for 0.8 seconds to open the menu.

          ### Assets
          - `LocationSpoofer.dylib`: Ad-hoc code-signed arm64 Mach-O dynamic library for iOS 14.0+
          EOF

          gh release view "$TAG" --repo getsentrix/LSpoof-Plus >/dev/null 2>&1 && {
            gh release upload "$TAG" LocationSpoofer.dylib --repo getsentrix/LSpoof-Plus --clobber
          } || {
            gh release create "$TAG" LocationSpoofer.dylib \
              --repo getsentrix/LSpoof-Plus \
              --title "$TAG - Neumorphic Soft UI & Harmonized Animations" \
              --notes-file notes.md || gh release upload "$TAG" LocationSpoofer.dylib --repo getsentrix/LSpoof-Plus --clobber
          }



