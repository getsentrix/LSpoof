name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag'
        required: false
        default: 'v1.1.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LocationSpoofer.dylib
        run: |
          xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 \
            -dynamiclib \
            -fobjc-arc \
            -Wall -Wextra \
            -ISource \
            Source/dylib_init.m \
            Source/LSHooking.m \
            Source/LocationSpoofer.m \
            Source/RouteSimulator.m \
            Source/BookmarksManager.m \
            Source/OverlayWindow.m \
            Source/MapPickerViewController.m \
            Source/MapPickerViewController+Route.m \
            Source/MapPickerViewController+Bookmarks.m \
            Source/PersistenceManager.m \
            Source/LSUpdateChecker.m \
            -framework Foundation \
            -framework UIKit \
            -framework CoreLocation \
            -framework MapKit \
            -framework CoreGraphics \
            -framework QuartzCore \
            -install_name @executable_path/Frameworks/LocationSpoofer.dylib \
            -o LocationSpoofer.dylib
          ls -lh LocationSpoofer.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationSpoofer.dylib
          path: LocationSpoofer.dylib

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              TAG="${GITHUB_REF#refs/tags/}"
            else
              TAG="v1.1.5"
            fi
          fi
          echo "Using tag: $TAG"
          cat << 'EOF' > notes.md
          ## LSpoof v1.1.5 - Liquid Glass UI, Staged Settings & Route Refinements

          ### What's New
          - **Staged Settings**: Settings, spoof coordinates, and simulations do not alter GPS until explicitly tapping **Save Settings**.
          - **True iOS Liquid Glass UI**: Clean native UIKit design with continuous corner curves (`kCACornerCurveContinuous`), 16pt radii, and zero emulated blur lag.
          - **Mini Map Preview on Saved Tab**: Mini map preview now stays visible (220pt) when viewing Bookmarks and Recents, jumping directly to tapped coordinates.
          - **Elaborated Heading & Bearing**: Added detailed footer instructions explaining how compass heading (0°-359°) influences Apple Maps, fitness apps, and games.
          - **Refined Route & Button Padding**: Added generous 52pt button heights, multi-line address support, and separated Get Route Directions into its own card section.

          ### Assets
          - `LocationSpoofer.dylib`: Sideloadable arm64 Mach-O dynamic library for iOS 14.0+
          EOF

          gh release view "$TAG" --repo getsentrix/LSpoof >/dev/null 2>&1 && {
            gh release upload "$TAG" LocationSpoofer.dylib --repo getsentrix/LSpoof --clobber
          } || {
            gh release create "$TAG" LocationSpoofer.dylib \
              --repo getsentrix/LSpoof \
              --title "$TAG - Dark Mode, 3-Tab Layout & UI Refinements" \
              --notes-file notes.md
          }

      - name: Update AltStore Source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/update_altstore.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/apps.json apps.json
          git diff --quiet && git diff --staged --quiet || {
            git commit -m "chore(altstore): auto-update apps.json repository source"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          }

