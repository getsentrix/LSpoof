name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag'
        required: false
        default: 'v1.1.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LocationSpoofer.dylib
        run: |
          xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 \
            -dynamiclib \
            -fobjc-arc \
            -Wall -Wextra \
            -ISource \
            Source/dylib_init.m \
            Source/LSHooking.m \
            Source/LocationSpoofer.m \
            Source/RouteSimulator.m \
            Source/BookmarksManager.m \
            Source/OverlayWindow.m \
            Source/MapPickerViewController.m \
            Source/MapPickerViewController+Route.m \
            Source/MapPickerViewController+Bookmarks.m \
            Source/PersistenceManager.m \
            Source/LSUpdateChecker.m \
            -framework Foundation \
            -framework UIKit \
            -framework CoreLocation \
            -framework MapKit \
            -framework CoreGraphics \
            -framework QuartzCore \
            -install_name @executable_path/Frameworks/LocationSpoofer.dylib \
            -o LocationSpoofer.dylib
          ls -lh LocationSpoofer.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationSpoofer.dylib
          path: LocationSpoofer.dylib

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              TAG="${GITHUB_REF#refs/tags/}"
            else
              TAG="v1.1.8"
            fi
          fi
          echo "Using tag: $TAG"
          cat << 'EOF' > notes.md
          ## LSpoof v1.1.8 - Production-Grade Top Bar Button & Touch Fix

          ### What's New
          - **Permanent Top Bar Button**: Attached directly to keyWindow with `LSTopBarMenuButton` expanded touch target. Never gets clipped by container view bounds or removed by subview recycling.
          - **Zero Random Disappearance**: Replaced destructive remove/re-add timer with idempotent frame reconciliation that keeps the button permanently in front.
          - **100% Touch Capture**: Reliable button clicks and zero touch pass-through when the menu is open.

          ### Assets
          - `LocationSpoofer.dylib`: Sideloadable arm64 Mach-O dynamic library for iOS 14.0+
          EOF

          gh release view "$TAG" --repo getsentrix/LSpoof >/dev/null 2>&1 && {
            gh release upload "$TAG" LocationSpoofer.dylib --repo getsentrix/LSpoof --clobber
          } || {
            gh release create "$TAG" LocationSpoofer.dylib \
              --repo getsentrix/LSpoof \
              --title "$TAG - Dark Mode, 3-Tab Layout & UI Refinements" \
              --notes-file notes.md
          }

      - name: Update AltStore Source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/update_altstore.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/apps.json apps.json
          git diff --quiet && git diff --staged --quiet || {
            git commit -m "chore(altstore): auto-update apps.json repository source"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          }

