name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag'
        required: false
        default: 'v1.1.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LocationSpoofer.dylib
        run: |
          xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 \
            -dynamiclib \
            -fobjc-arc \
            -Wall -Wextra \
            -ISource \
            Source/dylib_init.m \
            Source/LSHooking.m \
            Source/LocationSpoofer.m \
            Source/RouteSimulator.m \
            Source/BookmarksManager.m \
            Source/OverlayWindow.m \
            Source/MapPickerViewController.m \
            Source/MapPickerViewController+Route.m \
            Source/MapPickerViewController+Bookmarks.m \
            Source/PersistenceManager.m \
            -framework Foundation \
            -framework UIKit \
            -framework CoreLocation \
            -framework MapKit \
            -framework CoreGraphics \
            -framework QuartzCore \
            -install_name @executable_path/Frameworks/LocationSpoofer.dylib \
            -o LocationSpoofer.dylib
          ls -lh LocationSpoofer.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationSpoofer.dylib
          path: LocationSpoofer.dylib

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              TAG="${GITHUB_REF#refs/tags/}"
            else
              TAG="v1.1.1"
            fi
          fi
          echo "Using tag: $TAG"
          cat << 'EOF' > notes.md
          ## v1.1.1 - Inset Grouped UI Polish, Glitch Fixes & Apple SF Symbols

          ### What's New
          - **Retained Static Cell Architecture**: Modern `UITableViewStyleInsetGrouped` layout using retained static cells to eliminate layout thrashing, view re-parenting, and keyboard dismiss glitches during table reloads.
          - **Fixed Coordinate Typing Bug**: Smooth, continuous coordinate entry without cursor jumping, string reformatting disruptions, or premature haptic error shakes. Added `+/-` sign toggle on keyboard toolbar.
          - **Resilient Unit & Number Parsing**: Robust scanning of coordinates, altitude, drift radius, and custom speed values with or without unit suffixes (`m`, `km/h`).
          - **Collapsible Header & Fluid Animations**: Clean animated collapsing of search bar and coordinate mode segment on Bookmarks tab; auto-collapsing status pill layout.
          - **Bookmark Data Integrity & Non-Disruptive Editing**: Direct `indexPath` resolution on Apply action avoiding stale index bugs after deletion; smooth table editing animations without flickering.
          - **Touch & Gesture Polish**: Standard 500ms long-press threshold with touch filtering protecting annotation pin drag gestures.

          ### Assets
          - `LocationSpoofer.dylib`: Sideloadable arm64 Mach-O dynamic library for iOS 16.0+
          EOF

          gh release view "$TAG" --repo getsentrix/LSpoof >/dev/null 2>&1 && {
            gh release upload "$TAG" LocationSpoofer.dylib --repo getsentrix/LSpoof --clobber
          } || {
            gh release create "$TAG" LocationSpoofer.dylib \
              --repo getsentrix/LSpoof \
              --title "v1.1.1 - Inset Grouped UI Polish, Glitch Fixes & Apple SF Symbols" \
              --notes-file notes.md
          }
